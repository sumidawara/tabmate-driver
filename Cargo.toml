[package]
name = "tabmate-driver"
version = "0.1.0"
edition = "2021"

[dependencies]
evdev = { version = "0.13.2", features = ["tokio"] }
uinput = "0.1.3"
tokio = { version = "1", features = ["full"] }
bluer = { version = "0.17.3", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"